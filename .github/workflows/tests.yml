name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[validate,dev]"
      - run: pytest -q
      - run: matrix2ptu --help

  windows:
    # Installs with the same script a Windows user runs, then runs the tests.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with install_windows.ps1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install_windows.ps1 -Dev
      - name: Run tests
        shell: cmd
        run: .venv\Scripts\python -m pytest -q
      - name: Command works
        shell: cmd
        run: .venv\Scripts\matrix2ptu --help
