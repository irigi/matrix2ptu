# inputs3 Beads (640 nm, NA 1.4 oil per metadata, pinhole 8 AU): streamed .obf,
# 250 x 250 px, 20 nm, 100 us per pass, 2 sequences line-interleaved:
# per y-line 1 x CONF then 3 x STED (.msr line steps [1, 3]; 1000 line markers = 250 x 4).
# split_sequences: false (both sequences in one PTU, used for validation)

input:
  obf: inputs3/Beads.obf
  msr: inputs3/Beads.msr

output:
  directory: outputs/inputs3_reassignment/1_original/Beads/combined
  basename: Beads
  modes: [detector_resolved, pooled]
  split_sequences: false
  overwrite: true
  hw_type: "Abberior MATRIX (SPAD23) converted"

scan:
  pixels_x: 250
  pixels_y: 250
  pixel_size_um: 0.02
  pixel_dwell_us: 100            # per single line pass
  dwell_convention: per_line_pass
  bidirectional: false
  scan_type: linear
  frames: 1
  line_start_offset_us: 0.0

acquisition:
  mode: line_interleaved
  sequences:
    - name: CONF                  # pass 1 of each y-line: EXC640
      line_accumulation: 1
    - name: STED                  # passes 2-4: EXC640 + STED775 (Imspector gating on)
      line_accumulation: 3

detector:
  n_elements: 23
  sync_element: 23
  sync_divider: 32

timing:
  laser_frequency_hz: auto
  microtime_resolution_ps: 5
  apply_element_delays: true
  element_delays_ps: auto
  common_delay_ps: auto
  sync_smoothing_window: 64
